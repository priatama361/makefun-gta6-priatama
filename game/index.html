<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#bde8f4">
<meta name="description" content="Solana Bay: a sun-soaked browser crime story. Drive, run, take missions and evade the police.">
<title>Solana Bay - Sunny Side Up</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bde8f4; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solana Bay: drive and run through a sunlit open city, take story missions and escape the police"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<noscript>Solana Bay needs JavaScript to generate its city, story and sound locally.</noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
