<!doctype html>
<html lang="en">
<head>

<title>SOLANA BAY</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c1626; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

</style>
</head>
<body>
<canvas id="game" aria-label="SOLANA BAY: drive, steal cars, take jobs and outrun the police in a sunlit open world"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
